<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TrustLens Sentinel</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 320px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .logo {
      font-weight: 700;
      font-size: 14px;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .url {
      font-family: monospace;
      font-size: 11px;
      color: #94a3b8;
      word-break: break-all;
      margin-bottom: 12px;
    }
    .gauge-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 12px;
    }
    .score {
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 6px;
    }
    .badge-safe { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge-suspicious { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }
    .badge-dangerous { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
      border: none;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
    }
    .btn-secondary:hover { background: #475569; }
    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }
    .reasons {
      font-size: 11px;
      color: #cbd5e1;
      text-align: left;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️ TrustLens</div>
    <span style="font-size: 10px; color: #64748b;">Passive AI Sentinel</span>
  </div>

  <div id="url" class="url">Analyzing tab...</div>

  <div class="gauge-card">
    <div id="score" class="score">--</div>
    <div id="badge" class="badge">Scanning...</div>
    <div id="reasons" class="reasons">Checking cryptographic trust and domain telemetry...</div>
  </div>

  <a id="details-link" href="#" target="_blank" class="btn btn-primary">Detailed Security Report →</a>
  <a id="report-link" href="#" target="_blank" class="btn btn-danger">🚨 Report This URL</a>

  <script src="popup.js"></script>
</body>
</html>
